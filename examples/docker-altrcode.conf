; Example docker-altrcode config, to place in dispatcher/projects
; Lets the stack work on itself as a target project, with no make commands except git-push

; Basic project settings
[project]
name = docker-altrcode
root = /home/mike/Documents/Projets/docker-altrcode
container =

; Other directories related to the project
[extra_dirs]

; Allowed make targets. 0 = no argument | 1 = takes one argument.
[ops]
git-push = 1

; Files whose hash is checked before each operation (PIN_PROTECTION=1).
[pins]
.env

; Domains allowed by the egress proxy (DOMAIN_WHITELIST=1).
[domains]
allowed =
