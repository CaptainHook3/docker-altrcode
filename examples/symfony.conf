; Example symfony config, to place in dispatcher/projects
; Lets the stack work on the symfony project as a target project

; Basic project settings
[project]
name = symfony
root = /home/mike/Documents/Projets/symfony
container = symfony_php

; Other directories related to the project
[extra_dirs]
/home/mike/Documents/Projets/symfony-ansible = /work-ansible
/home/mike/Documents/Projets/symfony-terraform = /work-terraform

; Allowed make targets. 0 = no argument | 1 = takes one argument.
[ops]
ps = 1
logs = 1
up = 1
down = 1
build = 1
start = 1
stop = 1
pull = 1
composer = 1
console = 1
php = 1
fix = 1
fixdiff = 1
security = 1
npm = 1
yarn = 1
assets-build = 1
assets-dev = 0
git-push = 1

; Files whose hash is checked before each operation (PIN_PROTECTION=1).
[pins]
Makefile
docker-compose-dev.yml
app/.env.*.local

; Domains allowed by the egress proxy (DOMAIN_WHITELIST=1).
[domains]
allowed =
    my-symfony-project.fr
    symfony.com
